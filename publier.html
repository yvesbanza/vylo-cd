<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier une annonce - VYLO</title>
<style>
body { font-family: Arial; background:#111; color:white; padding:20px; max-width:600px; margin:auto; }
input, textarea, select { width:100%; padding:10px; margin:8px 0; border:none; border-radius:5px; }
button { background:#00ff88; color:black; padding:12px; border:none; border-radius:5px; font-weight:bold; width:100%; cursor:pointer; }
button:hover { background:#00cc6a; }
h1 { text-align:center; }
</style>
</head>
<body>
<h1>Publier une annonce</h1>
<form id="annonceForm">
  <input type="text" name="Titre" placeholder="Titre de l'annonce" required>
  <input type="number" name="Prix" placeholder="Prix en $" required>
  <textarea name="Description" placeholder="Description" rows="4" required></textarea>
  <select name="Categorie" required>
    <option value="">Choisir catégorie</option>
    <option>Telephones</option>
    <option>Vehicules</option>
    <option>Immobilier</option>
    <option>Mode</option>
    <option>Electronique</option>
  </select>
  <input type="text" name="Ville" placeholder="Ville: Kinshasa, Lubumbashi..." required>
  <input type="url" name="Photo" placeholder="Lien de la photo">
  <input type="hidden" name="Date" id="date">
  <button type="submit">Publier maintenant</button>
</form>
<p id="msg"></p>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyX0YAYltxAbUenbG_ewY-f2KwYfDrpNPezc_88ZOi4oiLB208xchIW9v4qxG8bPpBY/exec";
document.getElementById('date').value = new Date().toLocaleString('fr-CD');

document.getElementById('annonceForm').addEventListener('submit', e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerText = "Envoi en cours...";
  fetch(SCRIPT_URL, {
  method: 'POST',
  mode: 'no-cors',
  cache: 'no-cache',
  headers: {
    'Content-Type': 'application/json',
  },
  body: JSON.stringify(Object.fromEntries(new FormData(form)))
})
.then(() => {
  msg.innerText = "Annonce publiée avec succès !";
  form.reset();
})
.catch((err) => {
  msg.innerText = "Erreur: " + err;
});
</script>
</body>
</html>
