<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier une annonce - VYLO</title>
<style>
body{font-family:Arial;background:#f7f7f7;color:#333;padding:20px;max-width:500px;margin:auto;}
input,select,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:5px;}
button{background:#FF6600;color:white;padding:12px;border:none;border-radius:5px;font-weight:bold;width:100%;cursor:pointer;}
#status{margin-top:10px;font-weight:bold;}
.success{color:green;}.error{color:red;}
</style>
</head>
<body>

<h1>Publier une annonce</h1>

<form id="adForm">
    <input type="date" name="date" id="date" required>
    <input type="text" name="titre" id="titre" placeholder="Titre de l'annonce" required>
    <input type="number" name="prix" id="prix" placeholder="Prix en $" required>
    
    <select name="categorie" id="categorie" required>
        <option value="">Choisir catégorie</option>
        <option value="Téléphone">Téléphone</option>
        <option value="Véhicule">Véhicule</option>
        <option value="Immobilier">Immobilier</option>
        <option value="Électronique">Électronique</option>
    </select>
    
    <input type="text" name="ville" id="ville" placeholder="Ville: Kinshasa, Lubumbashi..." required>
    <input type="tel" name="telephone" id="telephone" placeholder="Téléphone WhatsApp" required>
    <input type="url" name="photos" id="photos" placeholder="Lien d'une photo">
    <textarea name="description" id="description" placeholder="Description" required></textarea>
    <button type="submit">Publier l'annonce</button>
</form>

<p id="status"></p>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtL4AJbj_nzzeRqkWJKHbo3x3kZD1hNmp-dUmp1wXdnzEg3u9_gOte1RfsFZPXSoUh/exec';

document.getElementById('date').value = new Date().toISOString().split('T')[0];

document.getElementById('adForm').addEventListener('submit', function(e){
    e.preventDefault();
    const status = document.getElementById('status');
    status.innerText = 'Envoi en cours...';
    status.className = '';
    
    const data = {
    date: document.getElementById('date').value,
    Titre: document.getElementById('titre').value,
    Prix: document.getElementById('prix').value,
    'Catégorie': document.getElementById('categorie').value,
    Ville: document.getElementById('ville').value,
    'Téléphone': document.getElementById('telephone').value,
    Photo: document.getElementById('photos').value,
    Description: document.getElementById('description').value
};
    
    const callbackName = 'cb_' + Date.now();
    const url = SCRIPT_URL + '?' + new URLSearchParams(data) + '&callback=' + callbackName;
    
    window[callbackName] = function(res) {
        status.innerText = 'Annonce publiée avec succès! ✅';
        status.className = 'success';
        document.getElementById('adForm').reset();
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        delete window[callbackName];
        s.remove();
    };
    
    const s = document.createElement('script');
    s.src = url;
    document.head.appendChild(s);
    
    setTimeout(() => {
        if(status.innerText === 'Envoi en cours...') {
            status.innerText = 'Erreur: Vérifiez le déploiement de VYLO-BACKEND';
            status.className = 'error';
        }
    }, 10000);
});
</script>

</body>
</html>
