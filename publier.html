<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publier - VYLO-CD</title>
  <style>
    body { font-family: Arial, sans-serif; background:#F5F5F5; margin:0; padding:0; }
    header { background:#FF6B00; color:white; padding:10px 15px; display:flex; align-items:center; gap:10px; }
    header img { height:40px; border-radius:5px; }
    header h1 { margin:0; font-size:22px; }
   .container { max-width:600px; margin:20px auto; padding:20px; background:white; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
   .form-group { margin-bottom:15px; }
    label { display:block; margin-bottom:5px; font-weight:bold; }
    input, select, textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:5px; box-sizing:border-box; font-size:14px; }
   .btn-submit { width:100%; background:#FF6B00; color:white; padding:15px; border:none; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
   .btn-submit:hover { background:#e55f00; }
   .devise-group { display:flex; gap:20px; }
   .devise-group label { font-weight:normal; }
   .back-link { display:block; text-align:center; margin-top:15px; color:#FF6B00; text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <img src="https://i.postimg.cc/Kvm4Z7ng/logo.jpg" alt="Logo VYLO">
    <h1>Publier une annonce</h1>
  </header>
  <div class="container">
    <form id="formAnnonce">
      <div class="form-group"><label>Titre *</label><input type="text" id="titre" placeholder="Ex: Samsung Galaxy S23" required></div>
      <div class="form-group"><label>Description *</label><textarea id="description" rows="4" placeholder="Décris ton produit" required></textarea></div>
      <div class="form-group"><label>Prix *</label><input type="number" id="prix" placeholder="Ex: 400" required></div>
      <div class="form-group">
        <label>Devise *</label>
        <div class="devise-group">
          <label><input type="radio" name="devise" value="$" checked> $ USD</label>
          <label><input type="radio" name="devise" value="FC"> FC Franc</label>
        </div>
      </div>
      <div class="form-group">
        <label>Catégorie *</label>
        <select id="categorie" required>
          <option value="">Choisir...</option>
          <option>Téléphone</option><option>Immobilier</option><option>Véhicule</option>
          <option>Mode</option><option>Divers</option><option>Autre</option>
        </select>
      </div>
      <div class="form-group"><label>Ville *</label><input type="text" id="ville" placeholder="Ex: Kinshasa" required></div>
      <div class="form-group"><label>Téléphone *</label><input type="tel" id="telephone" placeholder="0812345678" required></div>
      <div class="form-group"><label>WhatsApp *</label><input type="tel" id="whatsapp" placeholder="0812345678" required></div>
      <div class="form-group"><label>Lien Photo *</label><input type="url" id="photo" placeholder="Lien PostImage.com" required></div>
      <button type="submit" class="btn-submit">Publier l'annonce</button>
      <a href="index.html" class="back-link">← Retour aux annonces</a>
    </form>
  </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvbtelK53TcbL0AMBs1BHYdImzkw2le4oWbnEf2XnoPK7LQoUxW2-bhJ4EL-prTfE/exec';

document.getElementById('formAnnonce').addEventListener('submit', function(e) {
  e.preventDefault();
  const nouvelleAnnonce = {
    titre: document.getElementById('titre').value,
    description: document.getElementById('description').value,
    prix: document.getElementById('prix').value,
    devise: document.querySelector('input[name="devise"]:checked').value,
    categorie: document.getElementById('categorie').value,
    ville: document.getElementById('ville').value,
    telephone: document.getElementById('telephone').value,
    whatsapp: document.getElementById('whatsapp').value,
    photo: document.getElementById('photo').value
  };

  fetch(SCRIPT_URL + '?action=post', {
    method: 'POST',
    body: new URLSearchParams(nouvelleAnnonce)
  })
 .then(() => { 
    alert("Annonce publiée avec succès!"); 
    window.location.href = 'index.html';
  })
 .catch(err => alert("Erreur de connexion"));
});
</script>
</body>
</html>
