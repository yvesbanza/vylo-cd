<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier une annonce - VYLO</title>
<style>
body{font-family:Arial;background:#fff;color:#333;padding:20px;max-width:600px;margin:auto;}
input,textarea,select{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px;}
button{background:#FF6F00;color:white;padding:12px;border:none;border-radius:5px;font-weight:bold;width:100%;cursor:pointer;}
.success{color:green;font-weight:bold;} .error{color:red;font-weight:bold;}
</style>
</head>
<body>

<h1>Publier une annonce</h1>

<form id="formAnnonce">
  <input type="date" id="date" name="date" required>
  <input type="text" name="titre" placeholder="Titre de l'annonce" required>
  <input type="number" name="prix" placeholder="Prix en $" required>
  
  <select name="categorie" required>
    <option value="">Choisir catégorie</option>
    <option value="Telephone">Téléphone</option>
    <option value="Vehicule">Véhicule</option>
    <option value="Immobilier">Immobilier</option>
    <option value="Electronique">Électronique</option>
  </select>

  <input type="text" name="ville" placeholder="Ville: Kinshasa, Lubumbashi..." required>
  <input type="tel" name="tel" placeholder="Téléphone WhatsApp" required>
  <input type="url" name="photo" placeholder="Lien de la photo">
  <textarea name="description" placeholder="Description" required></textarea>
  <button type="submit">Publier l'annonce</button>
</form>

<p id="msg"></p>

<script>
const form = document.getElementById("formAnnonce");
const msg = document.getElementById("msg");
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUuLzvzAnUJdKg0Cs6FaApKn579sy73xcZB_M2stYfL4_j-CNLF9amTf5OMZSS7ASBJg/exec";

document.getElementById("date").value = new Date().toISOString().split('T')[0];

form.addEventListener("submit", (e) => {
  e.preventDefault();
  msg.textContent = "Envoi en cours...";
  msg.className = "";

  const data = {
    date: form.date.value,
    titre: form.titre.value,
    prix: form.prix.value,
    ville: form.ville.value,
    tel: form.tel.value,
    description: form.description.value,
    photo: form.photo.value
  };

  const script = document.createElement('script');
  script.src = SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify(data));
  document.body.appendChild(script);
});

function onSuccess(response) {
  if(response.result == "success"){
    msg.textContent = "Annonce publiée avec succès! ✅";
    msg.className = "success";
    form.reset();
    document.getElementById("date").value = new Date().toISOString().split('T')[0];
  } else {
    msg.textContent = "Erreur: " + response.msg;
    msg.className = "error";
  }
}
</script>
</body>
</html>
