<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publier une annonce - VYLO</title>
  <style>
    body { font-family: Arial; background:#111; color:white; padding:20px; max-width:600px; margin:auto; }
    input, textarea, select { width:100%; padding:10px; margin:10px 0; border:none; border-radius:5px; }
    button { background:#00FF7F; color:black; padding:15px; border:none; border-radius:5px; font-weight:bold; width:100%; cursor:pointer; }
    h1 { text-align:center; }
  </style>
</head>
<body>
  <h1>Publier une annonce</h1>
  
  <form id="annonceForm">
    <input type="hidden" id="date" name="date">
    <input type="text" id="titre" name="titre" placeholder="Titre de l'annonce" required>
    <input type="number" id="prix" name="prix" placeholder="Prix en $" required>
    <textarea id="description" name="description" placeholder="Description" rows="4" required></textarea>
    
    <select id="categorie" name="categorie" required>
      <option value="">Choisir catégorie</option>
      <option>Telephones</option>
      <option>Vehicules</option>
      <option>Immobilier</option>
      <option>Mode</option>
      <option>Electronique</option>
    </select>
    
    <input type="text" id="ville" name="ville" placeholder="Ville: Kinshasa, Lubumbashi..." required>
    <input type="tel" id="tel" placeholder="Téléphone WhatsApp" required>
    <input type="url" id="photo" name="photo" placeholder="Lien de la photo">
    <button type="submit">Publier l'annonce</button>
  </form>
  
  <p id="msg"></p>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNlngka1t_sI9cDmMVGuLfzcPgdiqMTdu_vwPusR4eKpF85F79mH2fxRAfSy-iTGxfqQ/exec";
const form = document.getElementById("annonce-form");
const msg = document.getElementById("message");

form.addEventListener("submit", e => {
  e.preventDefault();
  
  const data = {
    date: document.getElementById("date").value,
    titre: document.getElementById("titre").value,
    prix: document.getElementById("prix").value,
    ville: document.getElementById("ville").value,
    tel: document.getElementById("tel").value, // AJOUTE CE CHAMP DANS LE FORM
    description: document.getElementById("description").value,
    photo: document.getElementById("photo").value
  };

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors", // <- ÇA C'EST LA CLÉ
    body: JSON.stringify(data)
  })
 .then(() => {
    msg.textContent = "Annonce publiée avec succès! Vérifie ton Sheet.";
    msg.className = "success";
    form.reset();
    document.getElementById("date").value = new Date().toISOString().split('T')[0];
  })
 .catch(error => {
    msg.textContent = "Erreur: " + error.message;
    msg.className = "error";
  });
});
  </script>
</body>
</html>
