<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier une annonce - VYLO</title>
<style>
body { font-family: Arial; background:#111; color:white; padding:20px; max-width:600px; margin:auto; }
input, textarea, select { width:100%; padding:10px; margin:8px 0; border:none; border-radius:5px; }
button { background:#00ff88; color:black; padding:12px; border:none; border-radius:5px; font-weight:bold; width:100%; cursor:pointer; }
button:hover { background:#00cc6a; }
h1 { text-align:center; }
</style>
</head>
<body>
<h1>Publier une annonce</h1>
<form id="annonceForm">
<input type="text" id="titre" name="Titre" placeholder="Titre de l'annonce" required>
<input type="number" id="prix" name="Prix" placeholder="Prix en $ required">
<textarea id="description" name="Description" placeholder="Description" rows="4" required></textarea>
<select id="categorie" name="Categorie" required>
<input type="text" id="ville" name="Ville" placeholder="Ville: Kinshasa, Lubumbashi...">
<input type="url" id="photo" name="Photo" placeholder="Lien de la photo">
<input type="hidden" id="date" name="Date">
    <option value="">Choisir catégorie</option>
    <option>Telephones</option>
    <option>Vehicules</option>
    <option>Immobilier</option>
    <option>Mode</option>
    <option>Electronique</option>
  </select>
  <input type="text" id="titre" name="Titre" placeholder="Titre de l'annonce" required>
<input type="number" id="prix" name="Prix" placeholder="Prix en $ required">
<textarea id="description" name="Description" placeholder="Description" rows="4" required></textarea>
<select id="categorie" name="Categorie" required>
<input type="text" id="ville" name="Ville" placeholder="Ville: Kinshasa, Lubumbashi...">
<input type="url" id="photo" name="Photo" placeholder="Lien de la photo">
<input type="hidden" id="date" name="Date">
  <button type="submit">Publier maintenant</button>
</form>
<p id="msg"></p>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJVJ41h-P4Cog0jwwSIN-iZCD8UzLMVFASWcl2kOzMZD6Fgly5614C7eECZpb6cHRw/exec";

    document.getElementById('date').value = new Date().toLocaleString("fr-CD");

    document.getElementById('annonceForm').addEventListener('submit', e => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.innerText = "Envoi en cours...";

      const data = {
        titre: document.getElementById("titre").value,
        prix: document.getElementById("prix").value,
        ville: document.getElementById("ville").value,
        tel: "", // tu n'as pas de champ tel, je laisse vide pour l'instant
        description: document.getElementById("description").value + " | Cat: " + document.getElementById("categorie").value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
      })
      .then(() => {
        msg.innerText = "Annonce publiée avec succès !";
        document.getElementById('annonceForm').reset();
      })
      .catch((err) => {
        msg.innerText = "Erreur: " + err;
      });
    });
  </script>
</script>
</body>
</html>
