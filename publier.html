<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier une annonce - VYLO</title>
<style>
body{font-family:Arial;background:#fff;color:#333;padding:20px;max-width:600px;margin:auto;}
input,textarea,select{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:5px;}
button{background:#FF6F00;color:white;padding:12px;border:none;border-radius:5px;font-weight:bold;width:100%;cursor:pointer;}
.success{color:green;font-weight:bold;} .error{color:red;font-weight:bold;}
</style>
</head>
<body>

<h1>Publier une annonce</h1>

<form id="formAnnonce">
  <input type="date" id="date" name="date" required>
  <input type="text" name="titre" placeholder="Titre de l'annonce" required>
  <input type="number" name="prix" placeholder="Prix en $" required>
  
  <select name="categorie" required>
    <option value="">Choisir catégorie</option>
    <option value="Telephone">Téléphone</option>
    <option value="Vehicule">Véhicule</option>
    <option value="Immobilier">Immobilier</option>
    <option value="Electronique">Électronique</option>
  </select>

  <input type="text" name="ville" placeholder="Ville: Kinshasa, Lubumbashi..." required>
  <input type="tel" name="tel" placeholder="Téléphone WhatsApp" required>
  <input type="text" name="images" placeholder="Lien des photos, séparées par une virgule">
  <textarea name="description" placeholder="Description" required></textarea>
  <button type="submit">Publier l'annonce</button>
</form>

<p id="msg"></p>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBthA4iNsWIlE-9F_CGLaFpTt2Vmv8bgRUoviTSJDG13AjndrO19vNhgULP8rdrNUS/exec';

document.getElementById('adForm').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('status').innerText = 'Envoi en cours...';
    
    const data = {
        date: document.getElementById('date').value,
        titre: document.getElementById('titre').value,
        prix: document.getElementById('prix').value,
        categorie: document.getElementById('categorie').value,
        ville: document.getElementById('ville').value,
        telephone: document.getElementById('telephone').value,
        photos: document.getElementById('photos').value,
        description: document.getElementById('description').value
    };
    
    const params = new URLSearchParams(data).toString();
    const callbackName = 'callback_' + Date.now();
    
    window[callbackName] = function(response) {
        document.getElementById('status').innerText = 'Annonce publiée avec succès! ✅';
        document.getElementById('adForm').reset();
        delete window[callbackName];
        script.remove();
    };
    
    const script = document.createElement('script');
    script.src = SCRIPT_URL + '?' + params + '&callback=' + callbackName;
    document.body.appendChild(script);
    
    setTimeout(() => {
        if(document.getElementById('status').innerText === 'Envoi en cours...') {
            document.getElementById('status').innerText = 'Erreur: Vérifiez le déploiement du Script';
        }
    }, 10000);
});
          </script>
</body>
</html>
