<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-Cd - Annonces RDC</title>
<style>
    .annonce-card { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; background:white; }
.annonce-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
.categorie { background: #FF6B00; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; display:inline-block; margin:5px 0; }
.prix { color: #FF6B00; font-weight: bold; font-size: 18px; margin:5px 0; }
.ville { color: #666; margin:5px 0; }
.description { font-size: 14px; color: #555; margin: 8px 0; }
.btn-whatsapp { 
    display: block; background: #25D366; color: white; 
    padding: 10px; text-align: center; border-radius: 5px; 
    text-decoration: none; font-weight: bold; margin-top: 10px;
}
    body{
        font-family:Arial,sans-serif;
        background:#f5f5f5;
        margin:0;
        padding:0;
    }
    header{
        background:#FF6B00;
        color:white;
        padding:15px;
        text-align:center;
        font-size:22px;
        font-weight:bold;
    }
    .container{
        max-width:600px; /* ICI: limite sur PC */
        margin:0 auto;   /* ICI: centre le site */
        padding:15px;    /* ICI: espace sur les côtés */
    }
    .btn-publier{
        display:block;
        background:#FF6B00;
        color:white;
        text-align:center;
        padding:12px;
        margin-bottom:20px;
        border-radius:8px;
        text-decoration:none;
        font-weight:bold;
        font-size:16px; /* ICI: texte plus gros */
    }
    #search{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:2px solid #eee;
    border-radius:12px;
    font-size:16px;
    box-sizing:border-box;
}
#search:focus{
    border-color:#FF6B00;
    outline:none;
        }
    .card{
    background:white;
    border-radius:15px;
    padding:0;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.2s;
    overflow:hidden;
}
.card:hover{
    transform: translateY(-5px);
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
}
.card-content{
    padding:15px;
}
    .card img{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    }
    .prix{
        color:#FF6B00;
        font-size:20px; /* ICI: prix plus gros */
        font-weight:bold;
    }
    .info{
        color:#666;
        font-size:14px;
        margin:5px 0;
    }
    .titre{
        font-size:18px;
        font-weight:bold;
        margin:10px 0;
    }
    .btn-whatsapp{
    display:block;
    background:#25D366;
    color:white;
    padding:12px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    width:100%;
    text-align:center;
    margin-top:10px;
}
.btn-whatsapp:hover{
    background:#1DA851;
}
    }
</style>
</head>
<body>
<header>VYLO-Cd</header>
<div class="container">
  <a href="#" class="btn-publier">+ Publier une annonce</a>
<input type="text" id="search" placeholder="Rechercher un produit, une ville..." onkeyup="filtrer()">
<div id="annonces">Chargement des annonces...</div>
</div>
    <!-- FORMULAIRE -->
<div id="formulaire" style="display:none; background:white; padding:20px; margin:15px 0; border-radius:8px;">
    <h3>Publier une annonce</h3>
    <input type="text" id="titre" placeholder="Titre" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="number" id="prix" placeholder="Prix en FC" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="categorie" placeholder="Catégorie: Téléphone, Maison..." required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="ville" placeholder="Ville" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="telephone" placeholder="WhatsApp 243812345678" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="photo" placeholder="Lien de la Photo" required style="width:100%; padding:8px; margin:5px 0;">
    <textarea id="description" placeholder="Description" style="width:100%; padding:8px; margin:5px 0;"></textarea>
    <button onclick="envoyerAnnonce()" style="background:#FF6B00; color:white; border:none; padding:10px; width:100%; border-radius:5px;">Envoyer</button>
    <button onclick="fermerForm()" style="background:#ccc; border:none; padding:10px; width:100%; border-radius:5px; margin-top:5px;">Annuler</button>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKRXCpTbtB4PXeqmgomeYr4xv-xe4DXBIgme-HxtdhoA-usqsQ13rJPRyQ06-bMkAa/exec';const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKRXCpTbtB4PXeqmgomeYr4xv-xe4DXBIgme-HxtdhoA-usqsQ13rJPRyQ06-bMkAa/exec';
let toutesLesAnnonces = []; // pour garder les données en mémoire

async function chargerAnnonces() {
    document.getElementById('annonces').innerHTML = 'Chargement des annonces...';
    try {
        const res = await fetch(SCRIPT_URL, {mode: 'no-cors'});
        // Si no-cors bloque, on passe par un proxy
        const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(SCRIPT_URL);
        const proxyRes = await fetch(proxyUrl);
        const proxyData = await proxyRes.json();
        const data = JSON.parse(proxyData.contents);
        
        toutesLesAnnonces = data;
        afficherAnnonces(data);
    } catch(err) {
        document.getElementById('annonces').innerHTML = 'Erreur de chargement. Recharge la page.';
        console.error(err);
    }
}

function afficherAnnonces(data) {
    const container = document.getElementById('annonces');
    if(!data || data.length === 0) {
        container.innerHTML = '<p>Aucune annonce pour le moment.</p>';
        return;
    }

    let html = '';
    data.forEach(a => {
        let tel = a.Telephone.startsWith('243') ? a.Telephone : '243' + a.Telephone;
        html += `<div class="annonce-card">
            <img src="${a.Photo}" alt="${a.Titre}" onerror="this.src='https://via.placeholder.com/300x200'">
            <h3>${a.Titre}</h3>
            <p class="prix">${a.Prix} FC</p>
            <span class="categorie">${a.Categorie}</span>
            <p class="ville">📍 ${a.Ville}</p>
            <p class="description">${a.Description}</p>
            <a href="https://wa.me/${tel}" target="_blank" class="btn-whatsapp">
                Contacter sur WhatsApp
            </a>
        </div>`;
    });
    container.innerHTML = html;
                 }

// Fonction de recherche
document.getElementById('search').addEventListener('input', function(e) {
    const recherche = e.target.value.toLowerCase();
    const filtre = toutesLesAnnonces.filter(a => 
        a.Titre.toLowerCase().includes(recherche) ||
        a.Ville.toLowerCase().includes(recherche) ||
        a.Categorie.toLowerCase().includes(recherche)
    );
    afficherAnnonces(filtre);
});

// Au chargement
chargerAnnonces();
    // Ouvrir/Fermer le formulaire
document.querySelector('.btn-publier').addEventListener('click', () => {
    document.getElementById('formulaire').style.display = 'block';
});

function fermerForm() {
    document.getElementById('formulaire').style.display = 'none';
}

function envoyerAnnonce() {
    const data = {
        titre: document.getElementById('titre').value,
        prix: document.getElementById('prix').value,
        categorie: document.getElementById('categorie').value,
        ville: document.getElementById('ville').value,
        telephone: document.getElementById('telephone').value,
        photo: document.getElementById('photo').value,
        description: document.getElementById('description').value
    };
    
    fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data)
    }).then(() => {
        alert('Annonce publiée!');
        fermerForm();
        chargerAnnonces(); // recharge
    });
    }
</script>
</body>
</html>
