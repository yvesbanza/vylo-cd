<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-Cd - Annonces RDC</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}
header{background:#FF6B00;color:white;padding:15px;text-align:center;font-size:24px;font-weight:bold}
.container{max-width:900px;margin:20px auto;padding:10px}
.btn-publier{display:block;background:#FF6B00;color:white;text-align:center;padding:12px;border-radius:8px;text-decoration:none;font-weight:bold;margin-bottom:20px}
.card{background:white;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.prix{color:#FF6B00;font-size:20px;font-weight:bold}
.info{color:#666;font-size:14px;margin:5px 0}
.titre{font-size:18px;font-weight:bold;margin:10px 0}
.whatsapp{display:inline-block;background:#25D366;color:white;padding:8px 15px;border-radius:5px;text-decoration:none;margin-top:10px}
</style>
</head>
<body>
<header>VYLO-Cd</header>
<div class="container">
  <a href="publier.html" class="btn-publier">+ Publier une annonce</a>
  <div id="annonces">Chargement des annonces...</div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKvoYDFswXNVhlVUHP5XgGgg4j8h0tVzzOQkeK_JXlL1MM45ve5PwwP86OwtjhPAQ_/exec'; // METS TA VRAIE URL ICI

function loadAnnonces() {
  const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
  window[callbackName] = function(data) {
    document.getElementById('annonces').innerHTML = '';
    if(data.length === 0){
      document.getElementById('annonces').innerHTML = '<p>Aucune annonce pour le moment.</p>';
      return;
    }
    
    data.reverse().forEach(annonce => {
      const tel = annonce.Téléphone? annonce.Téléphone.replace(/[^0-9]/g, '') : '';
      const telWhatsApp = tel.startsWith('0') ? '243' + tel.substring(1) : tel;
      
      const card = `
        <div class="card">
          <img src="${annonce.Photo}" onerror="this.src='https://via.placeholder.com/400x200?text=Pas+d+image'">
          <div class="titre">${annonce.Titre}</div>
          <div class="prix">${annonce.Prix} $</div>
          <div class="info">${annonce.Catégorie} • ${annonce.Ville}</div>
          <div class="info">${annonce.Description}</div>
          <a href="https://wa.me/${telWhatsApp}" class="whatsapp" target="_blank">Contacter sur WhatsApp</a>
        </div>
      `;
      document.getElementById('annonces').innerHTML += card;
    });
