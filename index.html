<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYLO-CD</title>
  <style>
    body{font-family:Arial; margin:0; background:#f5f5f5}
    header{background:orange; color:white; padding:15px; display:flex; gap:10px; align-items:center; position:sticky; top:0}
    header img{height:40px; background:white; padding:5px; border-radius:8px}
   .btn-publier{background:orange; color:white; border:none; padding:12px 20px; border-radius:8px; font-weight:bold; margin:15px; cursor:pointer; width:calc(100% - 30px)}
   .annonce-card{background:white; margin:10px; padding:10px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
   .annonce-card img{width:100%; height:200px; object-fit:cover; border-radius:5px}
   .prix{color:orange; font-weight:bold; font-size:20px}
   .btn-call,.btn-whatsapp{display:inline-block; padding:10px 15px; margin:5px 5px 0 0; border-radius:5px; text-decoration:none; color:white; font-weight:bold}
   .btn-call{background:green}.btn-whatsapp{background:#25D366}
    /* FORMULAIRE */
   .modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; overflow-y:auto}
   .modal-content{background:white; margin:5% auto; padding:20px; width:90%; max-width:500px; border-radius:10px}
   .modal-content input,.modal-content textarea,.modal-content select{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:5px; box-sizing:border-box; font-size:16px}
   .modal-content button{background:orange; color:white; border:none; padding:14px; width:100%; border-radius:5px; font-weight:bold; cursor:pointer; font-size:16px}
   .close{float:right; font-size:28px; cursor:pointer; color:#999}
  </style>
</head>
<body>
  <header>
    <img src="https://i.postimg.cc/nL9cKQrP/logo.jpg" alt="VYLO">
    <h1>VYLO-CD</h1>
  </header>
  
  <button class="btn-publier" onclick="openModal()">+ Publier une annonce</button>

<input type="text" id="searchBar" placeholder="🔍 Rechercher: iPhone, Voiture, Kinshasa..." 
style="width:calc(100% - 30px); margin:0 15px 15px 15px; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px" 
onkeyup="searchAnnonces()">

<div id="annonces"><p style="text-align:center">Chargement...</p></div>

  <!-- POPUP FORMULAIRE -->
  <div id="formModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Publier une annonce</h2>
      <form id="annonceForm">
        <input type="text" name="titre" placeholder="Titre de l'annonce" required>
        <textarea name="description" placeholder="Description détaillée" rows="3" required></textarea>
        <input type="number" name="prix" placeholder="Prix" required>
        <select name="devise"><option value="FC">Franc Congolais FC</option><option value="$">Dollar $</option></select>
        <input type="text" name="ville" placeholder="Ville: Kinshasa, Lubumbashi..." required>
        <select name="categorie" required>
  <option value="">-- Choisir une catégorie --</option>
  <option value="Téléphone">Téléphone</option>
  <option value="Automobile">Automobile</option>
  <option value="Mode">Mode</option>
  <option value="Immobilier">Immobilier</option>
  <option value="Divers">Divers</option>
  <option value="Autre">Autre</option>
        </select>
        <input type="tel" name="telephone" placeholder="Téléphone: 099XXXXXXX" required>
        <input type="tel" name="whatsapp" placeholder="WhatsApp sans +243: 24399XXXXXXX">
        <input type="url" name="photo" placeholder="Lien de la photo: postimg.cc">
        <button type="submit">Publier maintenant</button>
      </form>
      <p id="formMsg" style="text-align:center; margin-top:10px"></p>
    </div>
  </div>

  let toutesLesAnnonces = []; // variable globale
<script>
const SHEETDB_READ = 'https://sheetdb.io/api/v1/ulpea3mizvmlt?sheet=ANNONCES';
const SHEETDB_WRITE = 'https://sheetdb.io/api/v1/ulpea3mizvmlt';

// OUVRIR / FERMER POPUP
function openModal(){document.getElementById('formModal').style.display='block'}
function closeModal(){document.getElementById('formModal').style.display='none'}
function afficherAnnonces(data) {
  const container = document.getElementById('annonces');
  if(data.length === 0) {
    container.innerHTML = '<p style="text-align:center;">Aucune annonce trouvée 😅</p>'; 
    return;
  }
  container.innerHTML = '';
  data.reverse().forEach(item => {
    container.innerHTML += `
    <div class="annonce-card">
      ${item.photo? `<img src="${item.photo}">` : ''}
      <h3>${item.titre}</h3>
      <p>${item.description}</p>
      <p class="prix">${item.prix} ${item.devise}</p>
      <p><b>Catégorie:</b> ${item.categorie}</p>
      <p><b>Ville:</b> ${item.ville}</p>
      <p><b>Tel:</b> 0${item.telephone}</p>
      <p><small>Publié le: ${item.date}</small></p>
      <a href="tel:0${item.telephone}" class="btn-call">📞 Appeler</a>
      ${item.whatsapp? `<a href="https://wa.me/${item.whatsapp}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>` : ''}
    </div>`;
  });
  }
// AFFICHER LES ANNONCES
async function fetchAnnonces() {
  const container = document.getElementById('annonces');
  try {
    const res = await fetch(SHEETDB_READ);
    const data = await res.json();
    toutesLesAnnonces = data; // on garde toutes les annonces en mémoire
    const annonces = data.filter(item => item.titre);
    
    if(annonces.length === 0) {container.innerHTML = '<p style="text-align:center">Aucune annonce pour le moment</p>'; return;}
    
    container.innerHTML = '';
    annonces.reverse().forEach(item => {
  container.innerHTML += `
    <div class="annonce-card">
      ${item.photo? `<img src="${item.photo}">` : ''}
      <h3>${item.titre}</h3>
      <p class="prix">${item.prix} ${item.devise}</p>
      <p>${item.description}</p>
      <p><b>Ville:</b> ${item.ville} | <b>Cat:</b> ${item.categorie}</p>
      <p><small>${item.date}</small></p>
      <a href="tel:${item.telephone}" class="btn-call">📞 Appeler</a>
      ${item.whatsapp? `<a href="https://wa.me/243${item.telephone.replace(/^0/,'')}" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>` : ''}
    </div>`;
  });
  } catch(e) {container.innerHTML = `<p style="color:red; text-align:center">ERREUR: ${e.message}</p>`;}
}

// ENVOYER LE FORMULAIRE VERS SHEETDB
document.getElementById('annonceForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  msg.innerText = 'Publication en cours...';
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());
  data.date = new Date().toLocaleString('fr-FR'); // Ajoute la date auto

  try {
    const res = await fetch(SHEETDB_WRITE, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({data: [data]})
    });
    
    if(res.ok){
      msg.innerText = '✅ Annonce publiée!';
      e.target.reset();
      setTimeout(()=>{closeModal(); fetchAnnonces(); msg.innerText=''}, 1500);
    } else {msg.innerText = '❌ Erreur de publication'}
  } catch(err){msg.innerText = '❌ Erreur: ' + err.message}
});
// FONCTION DE RECHERCHE
function searchAnnonces() {
  const terme = document.getElementById('searchBar').value.toLowerCase();
  
  const resultats = toutesLesAnnonces.filter(item => {
    return (
      item.titre.toLowerCase().includes(terme) ||
      item.description.toLowerCase().includes(terme) ||
      item.ville.toLowerCase().includes(terme) ||
      item.categorie.toLowerCase().includes(terme)
    );
  });
  
  afficherAnnonces(resultats);
  }
fetchAnnonces();
</script>
</body>
</html>
