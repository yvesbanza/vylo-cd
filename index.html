<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-Cd - Annonces RDC</title>
<style>
    body{ font-family:Arial,sans-serif; background:#f5f5f5; margin:0; padding:0; }
    header{ background:#FF6B00; color:white; padding:15px; text-align:center; font-size:22px; font-weight:bold; }
   .container{ max-width:600px; margin:0 auto; padding:15px; }
   .btn-publier{ display:block; background:#FF6B00; color:white; text-align:center; padding:12px; margin-bottom:20px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:16px; }
    #search{ width:100%; padding:14px; margin-bottom:20px; border:2px solid #eee; border-radius:12px; font-size:16px; box-sizing:border-box; }
    #search:focus{ border-color:#FF6B00; outline:none; }
   .annonce-card { border: 1px solid #ddd; padding: 15px; margin: 15px 0; border-radius: 8px; background:white; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
   .annonce-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
   .categorie { background: #FF6B00; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; display:inline-block; margin:5px 0; }
   .prix { color: #FF6B00; font-weight: bold; font-size: 20px; margin:5px 0; }
   .ville { color: #666; margin:5px 0; }
   .description { font-size: 14px; color: #555; margin: 8px 0; }
   .btn-whatsapp { display: block; background: #25D366; color: white; padding: 12px; text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; width:100%; }
   .btn-whatsapp:hover{ background:#1DA851; }
</style>
</head>
<body>
<header>VYLO-Cd</header>
<div class="container">
  <a href="#" class="btn-publier">+ Publier une annonce</a>
  <input type="text" id="search" placeholder="Recher un produit, une ville...">
  <div id="annonces">Chargement des annonces...</div>
</div>

<div id="formulaire" style="display:none; background:white; padding:20px; margin:15px 0; border-radius:8px;">
    <h3>Publier une annonce</h3>
    <input type="text" id="titre" placeholder="Titre" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="number" id="prix" placeholder="Prix en FC" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="categorie" placeholder="Catégorie: Téléphone, Maison..." required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="ville" placeholder="Ville" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="telephone" placeholder="WhatsApp 243812345678" required style="width:100%; padding:8px; margin:5px 0;">
    <input type="text" id="photo" placeholder="Lien de la Photo" required style="width:100%; padding:8px; margin:5px 0;">
    <textarea id="description" placeholder="Description" style="width:100%; padding:8px; margin:5px 0;"></textarea>
    <button onclick="envoyerAnnonce()" style="background:#FF6B00; color:white; border:none; padding:10px; width:100%; border-radius:5px;">Envoyer</button>
    <button onclick="fermerForm()" style="background:#ccc; border:none; padding:10px; width:100%; border-radius:5px; margin-top:5px;">Annuler</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHXH6-3DXGyZ8d3ja4fs1UI5tL7GIyMED7d_kO1UbxbesdlKxIkjAGvP8uEANG6YCC/exec";
function afficherAnnonces(data) {
    const container = document.getElementById('annonces');
    container.innerHTML = '<p style="color:green; font-size:20px; text-align:center">SI TU VOIS ÇA = LE JS MARCHE</p>';
}

window.onload = function() {
    afficherAnnonces([{Titre:"Test", Prix:"100"}]);
};
</script>
</body>
</html>
