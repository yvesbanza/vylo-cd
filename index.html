<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYLO-CD - Marketplace RDC</title>
  <style>
    body { font-family: Arial, sans-serif; background:#F5F5F5; margin:0; padding:0; }
    header { background:#FF6B00; color:white; padding:10px 15px; display:flex; align-items:center; gap:10px; }
    header img { height:40px; border-radius:5px; }
    header h1 { margin:0; font-size:22px; }
   .container { max-width:700px; margin:0 auto; padding:10px; }
   .top-bar { display:flex; gap:10px; margin:10px 0; }
   .btn-publier { flex:1; background:#FF6B00; color:white; text-align:center; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; text-decoration:none; }
    #search, #filterCat { flex:1; padding:12px; border:2px solid #eee; border-radius:8px; box-sizing:border-box; font-size:14px; }
   .annonce-card { background:white; border-radius:8px; margin:15px 0; box-shadow:0 2px 5px rgba(0,0,0,0.1); overflow:hidden; }
   .annonce-card img { width:100%; height:220px; object-fit:cover; }
   .annonce-info { padding:12px; }
   .annonce-info h3 { margin:0 0 5px 0; font-size:18px; }
   .prix { color:#FF6B00; font-weight:bold; font-size:20px; margin:5px 0; }
   .meta { color:#666; font-size:13px; margin:0 0 8px 0; }
   .description { font-size:14px; color:#444; margin:8px 0; }
   .btn-whatsapp { display:block; background:#25D366; color:white; text-align:center; padding:12px; text-decoration:none; font-weight:bold; }
   .btn-whatsapp:hover { background:#128C7E; }
    #loading { text-align:center; padding:30px; color:#666; }
  </style>
</head>
<body>
  <header>
    <img src="https://i.postimg.cc/Kvm4Z7ng/logo.jpg" alt="Logo VYLO">
    <h1>VYLO-CD</h1>
  </header>
  <div class="container">
    <div class="top-bar">
      <a href="publier.html" class="btn-publier">+ Publier</a>
      <select id="filterCat">
        <option value="">Toutes catégories</option>
        <option>Téléphone</option><option>Immobilier</option><option>Véhicule</option>
        <option>Mode</option><option>Divers</option><option>Autre</option>
      </select>
    </div>
    <input type="text" id="search" placeholder="Recher un produit, une ville...">
    <div id="annonces"><div id="loading">Chargement des annonces...</div></div>
  </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzvbtelK53TcbL0AMBs1BHYdImzkw2le4oWbnEf2XnoPK7LQoUxW2-bhJ4EL-prTfE/exec';
let toutesLesAnnonces = [];

function afficherAnnonces(data) {
  console.log("DONNEES REÇUES:", data);
  document.getElementById('loading').style.display = 'none'; // Cache le chargement
  toutesLesAnnonces = data;
  filtrerAnnonces();
}

function erreurChargement() {
    document.getElementById('loading').innerHTML = "Erreur de chargement. Vérifie le déploiement Google Script en 'Toute personne'";
}

function filtrerAnnonces() {
  const terme = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('filterCat').value;
  const filtrees = toutesLesAnnonces.filter(a => 
    (a.titre && a.titre.toLowerCase().includes(terme) || a.ville && a.ville.toLowerCase().includes(terme)) &&
    (cat === "" || a.categorie === cat)
  );
  
  const container = document.getElementById('annonces');
  container.innerHTML = '';
  if (filtrees.length == 0) {
    container.innerHTML = "<p style='text-align:center;'>Aucune annonce trouvée.</p>";
    return;
  }
  filtrees.forEach(annonce => {
    const card = document.createElement('div');
    card.className = 'annonce-card';
card.innerHTML = `
      <img src="${annonce.photo}" alt="${annonce.titre}" onerror="this.src='https://via.placeholder.com/400x220?text=Pas+dimage'">
      <div class="annonce-info">
        <h3>${annonce.titre}</h3>
        <p class="prix">${annonce.prix} ${annonce.devise}</p>
        <p class="description">${annonce.description}</p>
        <p class="meta">${annonce.ville} - ${annonce.categorie}</p>
      </div>
      <a href="https://wa.me/${annonce.whatsapp.replace(/\D/g,'')}" target="_blank" class="btn-whatsapp">Contacter sur WhatsApp</a>
    `;
container.appendChild(card);
  });
}

function chargerAnnonces() {
  const script = document.createElement('script');
  script.src = SCRIPT_URL + '?callback=afficherAnnonces&t=' + new Date().getTime();
  script.onerror = erreurChargement; // Si ça bug on le saura
  document.body.appendChild(script);

  // Si après 5s rien ne vient
  setTimeout(() => {
    if(document.getElementById('loading').style.display !== 'none'){
        erreurChargement();
    }
  }, 5000);
}

document.getElementById('search').addEventListener('input', filtrerAnnonces);
document.getElementById('filterCat').addEventListener('change', filtrerAnnonces);
window.onload = chargerAnnonces;
                   </script>
</body>
    </html>
