<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-Cd - Annonces RDC</title>
<style>
    body{
        font-family:Arial,sans-serif;
        background:#f5f5f5;
        margin:0;
        padding:0;
    }
    header{
        background:#FF6B00;
        color:white;
        padding:15px;
        text-align:center;
        font-size:22px;
        font-weight:bold;
    }
    .container{
        max-width:600px; /* ICI: limite sur PC */
        margin:0 auto;   /* ICI: centre le site */
        padding:15px;    /* ICI: espace sur les côtés */
    }
    .btn-publier{
        display:block;
        background:#FF6B00;
        color:white;
        text-align:center;
        padding:12px;
        margin-bottom:20px;
        border-radius:8px;
        text-decoration:none;
        font-weight:bold;
        font-size:16px; /* ICI: texte plus gros */
    }
    .card{
        background:white;
        border-radius:10px;
        padding:15px;
        margin-bottom:15px; /* ICI: espace entre cartes */
        box-shadow:0 2px 5px rgba(0,0,0,0.1); /* ICI: ombre jolie */
    }
    .card img{
        width:100%;
        height:200px; /* ICI: images plus grandes */
        object-fit:cover;
        border-radius:8px;
    }
    .prix{
        color:#FF6B00;
        font-size:20px; /* ICI: prix plus gros */
        font-weight:bold;
    }
    .info{
        color:#666;
        font-size:14px;
        margin:5px 0;
    }
    .titre{
        font-size:18px;
        font-weight:bold;
        margin:10px 0;
    }
    .whatsapp{
        display:inline-block;
        background:#25D366;
        color:white;
        padding:10px;
        border-radius:5px;
        text-decoration:none;
        font-weight:bold;
        width:100%; /* ICI: bouton prend toute la largeur */
        text-align:center;
        margin-top:10px;
    }
</style>
</head>
<body>
<header>VYLO-Cd</header>
<div class="container">
  <a href="publier.html" class="btn-publier">+ Publier une annonce</a>
  <div id="annonces">Chargement des annonces...</div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwKvoYDFswXNVhlVUHP5XgGgg4j8h0tVzzOQkeK_JXlL1MM45ve5PwwP86OwtjhPAQ_/exec';
    
    function loadAnnonces() {
    const callbackName = 'json_callback_' + Math.round(100000 * Math.random());
    window[callbackName] = function(data) {
        const container = document.getElementById('annonces');
        container.innerHTML = '';
        
        if(!data || data.length === 0){
            container.innerHTML = '<p>Aucune annonce pour le moment.</p>';
            return;
        }
        
        data.forEach(a => {
            const card = document.createElement('div');
            card.className = 'annonce-card';
            card.innerHTML = `
                <img src="${a.Photo || 'https://via.placeholder.com/400x250'}" alt="${a.Titre}">
                <div class="card-content">
                    <h3>${a.Titre}</h3>
                    <p class="prix">${a.Prix}$</p>
                    <p class="meta">${a.Ville} • ${a['Catégorie']}</p>
                    <p>${a.Description}</p>
                    <a href="tel:${a['Téléphone']}" class="btn-appeler">Appeler</a>
                </div>
            `;
            container.appendChild(card);
        });
    };
    
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?action=get&callback=${callbackName}`;
    document.body.appendChild(script);
    }
// Charger les annonces au démarrage
loadAnnonces();
</script>
</body>
</html>
