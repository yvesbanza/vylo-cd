<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-Cd - Annonces RDC</title>
<style>
    body{
        font-family:Arial,sans-serif;
        background:#f5f5f5;
        margin:0;
        padding:0;
    }
    header{
        background:#FF6B00;
        color:white;
        padding:15px;
        text-align:center;
        font-size:22px;
        font-weight:bold;
    }
    .container{
        max-width:600px; /* ICI: limite sur PC */
        margin:0 auto;   /* ICI: centre le site */
        padding:15px;    /* ICI: espace sur les côtés */
    }
    .btn-publier{
        display:block;
        background:#FF6B00;
        color:white;
        text-align:center;
        padding:12px;
        margin-bottom:20px;
        border-radius:8px;
        text-decoration:none;
        font-weight:bold;
        font-size:16px; /* ICI: texte plus gros */
    }
    #search{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:2px solid #eee;
    border-radius:12px;
    font-size:16px;
    box-sizing:border-box;
}
#search:focus{
    border-color:#FF6B00;
    outline:none;
        }
    .card{
    background:white;
    border-radius:15px;
    padding:0;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    transition: transform 0.2s;
    overflow:hidden;
}
.card:hover{
    transform: translateY(-5px);
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
}
.card-content{
    padding:15px;
}
    .card img{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
    }
    .prix{
        color:#FF6B00;
        font-size:20px; /* ICI: prix plus gros */
        font-weight:bold;
    }
    .info{
        color:#666;
        font-size:14px;
        margin:5px 0;
    }
    .titre{
        font-size:18px;
        font-weight:bold;
        margin:10px 0;
    }
    .btn-whatsapp{
    display:block;
    background:#25D366;
    color:white;
    padding:12px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    width:100%;
    text-align:center;
    margin-top:10px;
}
.btn-whatsapp:hover{
    background:#1DA851;
}
    }
</style>
</head>
<body>
<header>VYLO-Cd</header>
<div class="container">
  <a href="publier.html" class="btn-publier">+ Publier une annonce</a>
<input type="text" id="search" placeholder="Rechercher un produit, une ville..." onkeyup="filtrer()">
<div id="annonces">Chargement des annonces...</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKRXCpTbtB4PXeqmgomeYr4xv-xe4DXBIgme-HxtdhoA-usqsQ13rJPRyQ06-bMkAa/exec";

function afficherAnnonces(data) {
    const container = document.getElementById('annonces');
    if(!data || data.length === 0) {
        container.innerHTML = '<p>Aucune annonce pour le moment</p>';
        return;
    }
    
    let html = '';
    data.forEach(a => {
        html += `<div class="annonce-card">
            <img src="${a.Photo}" alt="${a.Titre}">
            <h3>${a.Titre}</h3>
            <p class="prix">${a.Prix} FC</p>
            <p class="ville">${a.Ville}</p>
        </div>`;
    });
    container.innerHTML = html;
}

window.onload = function() {
    const script = document.createElement('script');
    script.src = SCRIPT_URL + '?callback=afficherAnnonces';
    script.onerror = function() { 
        document.getElementById('annonces').innerHTML = '<p style="color:red">Erreur: Impossible de charger les annonces</p>';
    }
    document.head.appendChild(script);
};
                </script>
</body>
</html>
