<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYLO-CD - Marketplace RDC</title>
  <style>
    body { font-family: Arial, sans-serif; background:#F5F5F5; margin:0; padding:0; }
    header { background:#FF6B00; color:white; padding:10px 15px; display:flex; align-items:center; gap:10px; }
    header img { height:40px; border-radius:5px; }
    header h1 { margin:0; font-size:22px; }
   .container { max-width:700px; margin:0 auto; padding:10px; }
   .top-bar { display:flex; gap:10px; margin:10px 0; }
   .btn-publier { flex:1; background:#FF6B00; color:white; text-align:center; padding:12px; border:none; border-radius:8px; font-size:16px; font-weight:bold; text-decoration:none; }
    #search, #filterCat { flex:1; padding:12px; border:2px solid #eee; border-radius:8px; box-sizing:border-box; font-size:14px; }
   .annonce-card { background:white; border-radius:8px; margin:15px 0; box-shadow:0 2px 5px rgba(0,0,0,0.1); overflow:hidden; }
   .annonce-card img { width:100%; height:220px; object-fit:cover; }
   .annonce-info { padding:12px; }
   .annonce-info h3 { margin:0 0 5px 0; font-size:18px; }
   .prix { color:#FF6B00; font-weight:bold; font-size:20px; margin:5px 0; }
   .meta { color:#666; font-size:13px; margin:0 0 8px 0; }
   .description { font-size:14px; color:#444; margin:8px 0; }
   .btn-whatsapp { display:block; background:#25D366; color:white; text-align:center; padding:12px; text-decoration:none; font-weight:bold; }
   .btn-whatsapp:hover { background:#128C7E; }
    #loading { text-align:center; padding:30px; color:#666; }
  </style>
</head>
<body>
  <header>
    <img src="https://i.postimg.cc/Kvm4Z7ng/logo.jpg" alt="Logo VYLO">
    <h1>VYLO-CD</h1>
  </header>
  <div class="container">
    <div class="top-bar">
      <a href="publier.html" class="btn-publier">+ Publier</a>
      <select id="filterCat">
        <option value="">Toutes catégories</option>
        <option>Téléphone</option><option>Immobilier</option><option>Véhicule</option>
        <option>Mode</option><option>Divers</option><option>Autre</option>
      </select>
    </div>
    <input type="text" id="search" placeholder="Recher un produit, une ville...">
    <div id="annonces"><div id="loading">Chargement des annonces...</div></div>
  </div>

<script>
const SHEET_ID = '1h0kKoCdJ59-yvYurhA0A3gGkRT8T4Z76LeRXTyqrNqs';
const SHEET_NAME = 'ANNONCES';
const container = document.getElementById('annonces-list'); // vérifie que ton div a id="annonces-list"

async function chargerAnnonces() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substr(47).slice(0, -2));
    const rows = json.table.rows;
    
    const annonces = rows.slice(1).map(row => ({
      date: row.c[0]?.v || '',
      titre: row.c[1]?.v || '',
      description: row.c[2]?.v || '',
      prix: row.c[3]?.v || '0',
      devise: row.c[4]?.v || '$',
      categorie: row.c[5]?.v || '',
      ville: row.c[6]?.v || '',
      telephone: row.c[7]?.v || '',
      photo: row.c[8]?.v || 'https://via.placeholder.com/300',
      whatsapp: row.c[9]?.v || ''
    })).filter(a => a.titre);
    
    if(annonces.length === 0){
      container.innerHTML = '<p>Aucune annonce pour le moment</p>';
      return;
    }

    annonces.forEach(annonce => {
      const card = document.createElement('div');
      card.className = 'annonce-card';
      const numeroWA = annonce.whatsapp || annonce.telephone;

      card.innerHTML = `
        <img src="${annonce.photo}" alt="${annonce.titre}" onerror="this.src='https://via.placeholder.com/300'">
        <div class="annonce-info">
          <h3>${annonce.titre}</h3>
          <p class="prix">${annonce.prix} ${annonce.devise}</p>
          <p class="description">${annonce.description}</p>
          <p class="meta">${annonce.ville} - ${annonce.categorie}</p>
          <p class="date" style="font-size:12px; color:gray;">${annonce.date}</p>
        </div>
        <a href="https://wa.me/${numeroWA.replace(/\D/g,'')}" target="_blank">Contacter sur WhatsApp</a>
      `;
      container.appendChild(card);
    });

  } catch(err) {
    container.innerHTML = '<p>Erreur: Impossible de charger les annonces</p>';
    console.error(err);
  }
}

window.onload = chargerAnnonces;
</body>
    </html>
