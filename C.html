<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYLO-CD</title>
  <style>
:root {
  --bg-color: #FFFFFF;
  --text-color: #000;
  --card-bg: #F5F5F5;
  --header-bg: #FF8C00;
}

body.dark-mode {
  --bg-color: #121212;
  --text-color: #FFFFFF;
  --card-bg: #1E1E1E;
  --header-bg: #000000;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: 0.3s;
}

header {
  background-color: var(--header-bg);
  color: white;
  transition: 0.3s;
}

.annonce-card {
  background-color: var(--card-bg);
  color: var(--text-color);
  transition: 0.3s;
}

/* Pour que le prix reste orange dans les 2 modes */
.prix {
  color: #FF8C00 !important;
}
  </style>
</head>
<body>
  <header>
    <img src="https://i.postimg.cc/nL9cKQrP/logo.jpg" alt="VYLO">
    <h1>VYLO-CD</h1>
<button id="toggleTheme" style="background:none; border:none; font-size:24px; cursor:pointer; margin-left:10px;">🌙</button>
  </header>
  
  <button class="btn-publier" onclick="openModal()">+ Publier une annonce</button>

<input type="text" id="searchBar" placeholder="🔍 Rechercher: iPhone, Voiture, Kinshasa..." 
style="width:calc(100% - 30px); margin:0 15px 15px 15px; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:16px" 
onkeyup="searchAnnonces()">

<div id="annonces"><p style="text-align:center">Chargement...</p></div>

  <!-- POPUP FORMULAIRE -->
  <div id="formModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>Publier une annonce</h2>
      <form id="annonceForm">
        <input type="text" name="titre" placeholder="Titre de l'annonce" required>
        <textarea name="description" placeholder="Description détaillée" rows="3" required></textarea>
        <input type="number" name="prix" placeholder="Prix" required>
        <select name="devise"><option value="FC">Franc Congolais FC</option><option value="$">Dollar $</option></select>
        <input type="text" name="ville" placeholder="Ville: Kinshasa, Lubumbashi..." required>
        <select name="categorie" required>
  <option value="">-- Choisir une catégorie --</option>
  <option value="Téléphone">Téléphone</option>
  <option value="Automobile">Automobile</option>
  <option value="Mode">Mode</option>
  <option value="Immobilier">Immobilier</option>
  <option value="Électronique">Électronique</option>
  <option value="Divers">Divers</option>
  <option value="Autre">Autre</option>
        </select>
        <input type="tel" name="telephone" placeholder="Téléphone: 099XXXXXXX" required>
        <input type="tel" name="whatsapp" placeholder="WhatsApp sans +243: 24399XXXXXXX">
        <input type="url" name="photo" placeholder="Lien de la photo: postimg.cc">
        <button type="submit">Publier maintenant</button>
      </form>
      <p id="formMsg" style="text-align:center; margin-top:10px"></p>
    </div>
  </div>

<script>
const SHEETDB_READ = 'https://sheetdb.io/api/v1/ulpea3mizvmlt';
const SHEETDB_WRITE = 'https://sheetdb.io/api/v1/ulpea3mizvmlt';

// OUVRIR / FERMER POPUP
function openModal(){document.getElementById('formModal').style.display='block'}
function closeModal(){document.getElementById('formModal').style.display='none'}

// AFFICHER LES ANNONCES
async function fetchAnnonces() {
  const container = document.getElementById('annonces');
  try {
    const res = await fetch(SHEETDB_READ);
    const data = await res.json();
    const annonces = data.filter(item => item.titre);
    
    if(annonces.length === 0) {container.innerHTML = '<p style="text-align:center">Aucune annonce pour le moment</p>'; return;}
    
    container.innerHTML = '';
    annonces.reverse().forEach(item => {
      container.innerHTML += `
        <div class="annonce-card">
          ${item.photo? `<img src="${item.photo}">` : ''}
          <h3>${item.titre}</h3>
          <p class="prix">${item.prix} ${item.devise}</p>
          <p>${item.description}</p>
          <p><b>Ville:</b> ${item.ville} | <b>Cat:</b> ${item.categorie}</p>
          <p><small>${item.date}</small></p>
          <a href="tel:${item.telephone}" class="btn-call"><img src="https://cdn-icons-png.flaticon.com/512/597/597177.png"> Appeler</a>
${item.whatsapp ? `<a href="https://wa.me/${item.whatsapp}" target="_blank" class="btn-whatsapp"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"></a>` : ''}
        </div>`;
    });
  } catch(e) {container.innerHTML = `<p style="color:red; text-align:center">ERREUR: ${e.message}</p>`;}
}

// ENVOYER LE FORMULAIRE VERS SHEETDB
document.getElementById('annonceForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const msg = document.getElementById('formMsg');
  msg.innerText = 'Publication en cours...';
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());
  data.date = new Date().toLocaleString('fr-FR'); // Ajoute la date auto

  try {
    const res = await fetch(SHEETDB_WRITE, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({data: [data]})
    });
    
    if(res.ok){
      msg.innerText = '✅ Annonce publiée!';
      e.target.reset();
      setTimeout(()=>{closeModal(); fetchAnnonces(); msg.innerText=''}, 1500);
    } else {msg.innerText = '❌ Erreur de publication'}
  } catch(err){msg.innerText = '❌ Erreur: ' + err.message}
});

fetchAnnonces();
// MODE SOMBRE
const btn = document.getElementById('toggleTheme');
btn.onclick = () => {
  document.body.classList.toggle('dark');
  btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
}
// Garder le thème choisi
if(localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  btn.textContent = '☀️';
}
</script>
</body>
                                                                   </html>
