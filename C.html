<!DOCTYPE html>
<html lang="fr">
<head>
<title>VYLO-CD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#FFA500;color:white;padding:12px 15px;display:flex;align-items:center;gap:10px}
.header img{width:45px;height:45px;border-radius:10px;background:white;padding:2px}
.btn-publier{background:#FFA500;color:white;border:none;padding:12px 20px;border-radius:8px;margin:15px;font-weight:bold;cursor:pointer}
#formulaire{display:none;background:white;margin:15px;padding:15px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
input,select,textarea{width:95%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:5px}
.annonce{background:white;margin:15px;padding:15px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.annonce img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.prix{color:#FF8C00;font-weight:bold;font-size:20px}
.btn{padding:10px 15px;border:none;border-radius:5px;color:white;margin-right:8px;cursor:pointer}
.btn-appeler{background:green} .btn-whatsapp{background:#25D366}
</style>
</head>
<body>
<div class="header">
  <img src="https://i.postimg.cc/d3mG4Th1/logo.jpg" alt="VYLO-CD Logo">
  <h2>VYLO-CD</h2>
</div>

<button class="btn-publier" onclick="document.getElementById('formulaire').style.display='block'">+ Publier</button>

<div id="formulaire">
  <h3>Publier une annonce</h3>
  <input id="titre" placeholder="Titre: iPhone 13 Pro Max">
  <input id="prix" type="number" placeholder="Prix en $">
  <textarea id="description" placeholder="Description détaillée"></textarea>
  <input id="ville" placeholder="Ville: Kinshasa, Lubumbashi...">
  <input id="whatsapp" placeholder="Numéro WhatsApp: 081...">
  <button onclick="alert('Bientôt: Sauvegarde directe dans Google Sheet')">Envoyer</button>
</div>

<input id="search" placeholder="🔍 Rechercher: iPhone, Voiture, Kinshasa..." onkeyup="filtrer()" style="width:90%;margin:0 15px 15px 15px;padding:12px;border-radius:8px;border:1px solid #ccc">
<div id="annonces">Chargement des annonces...</div>

<script>
const SHEETDB_URL = 'https://api.allorigins.win/raw?url=https://sheetdb.io/api/v1/ulpea3mizvmlt';
let toutesAnnonces = [];

async function chargerAnnonces() {
  try {
    const res = await fetch(SHEETDB_URL);
    const text = await res.text();
    const data = JSON.parse(text).contents ? JSON.parse(JSON.parse(text).contents) : JSON.parse(text);
    toutesAnnonces = data;
    afficherAnnonces(data);
  } catch(e) {
    document.getElementById('annonces').innerHTML = `<p style="color:red;text-align:center">ERREUR: ${e.message}</p>`;
  }
}

function afficherAnnonces(data){
  let html = '';
  data.forEach(a => {
    html += `<div class="annonce">
      <img src="${a.image || 'https://via.placeholder.com/300x200/FFA500/FFFFFF?text=VYLO-CD'}" alt="${a.titre}">
      <h3>${a.titre}</h3>
      <div class="prix">${Number(a.prix).toLocaleString()} $</div>
      <p>${a.description}</p>
      <p><b>📍 ${a.ville}</b> | <b>Cat:</b> ${a.categorie}</p>
      <button class="btn btn-appeler" onclick="alert('Appel: ${a.whatsapp}')">Appeler</button>
      <button class="btn btn-whatsapp" onclick="window.open('https://wa.me/243${a.whatsapp}')">WhatsApp</button>
    </div>`;
  });
  document.getElementById('annonces').innerHTML = html || "Aucune annonce trouvée";
}

function filtrer(){
  const term = document.getElementById('search').value.toLowerCase();
  const filtrees = toutesAnnonces.filter(a => 
    a.titre.toLowerCase().includes(term) || a.ville.toLowerCase().includes(term) || a.categorie.toLowerCase().includes(term)
  );
  afficherAnnonces(filtrees);
}

chargerAnnonces();
</script>
</body>
</html>
