<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                radial-gradient(circle at bottom right, #141e30, transparent 40%),
                #0f172a;
            overflow: hidden;
        }

        /* Lumières animées */

        .light {
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
        }

        .light-one {
            background: #2563eb;
            top: -80px;
            left: -80px;
            animation: moveOne 8s infinite alternate ease-in-out;
        }

        .light-two {
            background: #7c3aed;
            bottom: -100px;
            right: -100px;
            animation: moveTwo 10s infinite alternate ease-in-out;
        }

        @keyframes moveOne {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(180px, 130px);
            }
        }

        @keyframes moveTwo {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-180px, -140px);
            }
        }

        /* Conteneur */

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* Carte */

        .login-card {
            padding: 40px 32px;
            border-radius: 24px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

            animation: cardAppear 0.8s ease forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);

            color: white;
            font-size: 30px;
            font-weight: bold;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Champs */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            font-size: 15px;

            transition: 0.25s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            border-color: #60a5fa;

            background: rgba(255, 255, 255, 0.12);

            box-shadow:
                0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        /* Mot de passe */

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: rgba(255, 255, 255, 0.6);

            cursor: pointer;
            font-size: 13px;
        }

        /* Options */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 24px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: rgba(255, 255, 255, 0.7);
        }

        .remember input {
            width: auto;
            height: auto;
        }

        .forgot {
            color: #93c5fd;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Bouton */

        .login-button {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(37, 99, 235, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner */

        .spinner {
            display: inline-block;

            width: 18px;
            height: 18px;

            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Message */

        .message {
            display: none;

            margin-bottom: 20px;
            padding: 12px 14px;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.4;
        }

        .message.error {
            display: block;

            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);

            color: #fecaca;
        }

        .message.success {
            display: block;

            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);

            color: #bbf7d0;
        }

        /* Bas de carte */

        .footer {
            margin-top: 28px;

            text-align: center;

            color: rgba(255, 255, 255, 0.45);

            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 480px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 32px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="light light-one"></div>
    <div class="light light-two"></div>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                🔐
            </div>

            <h1>Connexion</h1>

            <p class="subtitle">
                Connectez-vous à votre espace
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Adresse e-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemple@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            Afficher
                        </button>

                    </div>

                </div>

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Se souvenir de moi

                    </label>

                    <a
                        href="#"
                        class="forgot"
                        id="forgotPassword"
                    >
                        Mot de passe oublié ?
                    </a>

                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Se connecter
                </button>

            </form>

            <div class="footer">
                © 2026 — Tous droits réservés
            </div>

        </section>

    </main>


    <!-- Firebase -->

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        /*
         * =====================================================
         * CONFIGURATION FIREBASE
         * =====================================================
         *
         * REMPLACE les valeurs ci-dessous par celles
         * de TON projet Firebase.
         */

        const firebaseConfig = {

            apiKey: "TON_API_KEY",

            authDomain:
                "TON_PROJET.firebaseapp.com",

            projectId:
                "TON_PROJECT_ID",

            storageBucket:
                "TON_PROJECT_ID.firebasestorage.app",

            messagingSenderId:
                "TON_MESSAGING_SENDER_ID",

            appId:
                "TON_APP_ID"

        };


        /*
         * Initialisation Firebase
         */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        /*
         * Éléments HTML
         */

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const rememberInput =
            document.getElementById("remember");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        const togglePassword =
            document.getElementById("togglePassword");

        const forgotPassword =
            document.getElementById("forgotPassword");


        /*
         * Afficher un message
         */

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        /*
         * Effacer le message
         */

        function clearMessage() {

            message.textContent = "";

            message.className =
                "message";

        }


        /*
         * Afficher / cacher le mot de passe
         */

        togglePassword.addEventListener(
            "click",
            () => {

                if (
                    passwordInput.type === "password"
                ) {

                    passwordInput.type = "text";

                    togglePassword.textContent =
                        "Masquer";

                } else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "Afficher";
                }

            }
        );


        /*
         * MOT DE PASSE OUBLIÉ
         */

        forgotPassword.addEventListener(
            "click",
            async (event) => {

                event.preventDefault();

                clearMessage();

                const email =
                    emailInput.value.trim();

                if (!email) {

                    showMessage(
                        "Entrez d'abord votre adresse e-mail.",
                        "error"
                    );

                    emailInput.focus();

                    return;
                }

                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );

                    showMessage(
                        "Un lien de réinitialisation a été envoyé à votre adresse e-mail.",
                        "success"
                    );

                } catch (error) {

                    showMessage(
                        getFirebaseErrorMessage(error),
                        "error"
                    );

                }

            }
        );


        /*
         * CONNEXION
         */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                clearMessage();

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "Veuillez remplir tous les champs.",
                        "error"
                    );

                    return;
                }


                /*
                 * Désactiver le bouton
                 */

                loginButton.disabled = true;

                loginButton.innerHTML =
                    '<span class="spinner"></span>Connexion...';


                try {

                    /*
                     * Choix de la persistance
                     */

                    if (rememberInput.checked) {

                        await setPersistence(
                            auth,
                            browserLocalPersistence
                        );

                    } else {

                        await setPersistence(
                            auth,
                            browserSessionPersistence
                        );

                    }


                    /*
                     * Connexion Firebase
                     */

                    const userCredential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    console.log(
                        "Utilisateur connecté :",
                        user.uid
                    );


                    showMessage(
                        "Connexion réussie. Redirection...",
                        "success"
                    );


                    /*
                     * REDIRECTION
                     *
                     * Change cette page si ton tableau
                     * de bord porte un autre nom.
                     */

                    setTimeout(() => {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    showMessage(
                        getFirebaseErrorMessage(error),
                        "error"
                    );

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Se connecter";

                }

            }
        );


        /*
         * Traduction des erreurs Firebase
         */

        function getFirebaseErrorMessage(error) {

            switch (error.code) {

                case "auth/invalid-email":

                    return "L'adresse e-mail n'est pas valide.";

                case "auth/user-not-found":

                    return "Aucun compte ne correspond à cette adresse e-mail.";

                case "auth/wrong-password":

                    return "Le mot de passe est incorrect.";

                case "auth/invalid-credential":

                    return "Adresse e-mail ou mot de passe incorrect.";

                case "auth/too-many-requests":

                    return "Trop de tentatives. Veuillez patienter quelques instants.";

                case "auth/user-disabled":

                    return "Ce compte a été désactivé.";

                case "auth/network-request-failed":

                    return "Problème de connexion Internet.";

                default:

                    return "Impossible de se connecter. Veuillez réessayer.";
            }

        }

    </script>

</body>
    </html>
