<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-CD</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f5f5}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;overflow-y:auto}
.modal-content{background:#fff;margin:20px auto;padding:20px;border-radius:16px;max-width:500px}
.annonce-card{background:#fff;border-radius:14px;margin:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07);border:1px solid #eee}
.annonce-photo{width:100%;height:240px;object-fit:cover}
.annonce-header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.right-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;background:#f2f2f2;border-radius:10px;display:flex;align-items:center;justify-content:center;border:none;font-size:16px;cursor:pointer}
.seller-menu{display:none;position:absolute;right:0;top:40px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.15);border-radius:10px;padding:8px;z-index:10;width:130px}
.seller-menu.show{display:block}
#previewProfil{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #FF8C00}
.profil-input{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #ddd;outline:none}
</style>
</head>
<body>

<div style="background:#FF8C00;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100">
<div style="background:#fff;border-radius:8px;padding:4px 10px;font-weight:800;color:#0B7E2E;font-size:12px">🛒 VYLO</div>
<b style="color:#fff;font-size:18px">VYLO-CD</b>
<img id="profilAvatar" onclick="ouvrirProfil()" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:36px;height:36px;border-radius:50%;background:#fff;cursor:pointer">
</div>

<div style="padding:12px;background:#fff">
<button onclick="openModal()" style="width:100%;background:#FF8C00;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:bold;font-size:15px">+ Publier une annonce</button>
</div>

<div style="padding:10px;display:flex;gap:10px;background:#fff;margin-bottom:8px">
<input id="searchBar" oninput="searchAnnonces()" placeholder="Rechercher iPhone, voiture..." style="flex:1;padding:12px;border-radius:10px;border:1px solid #e0e0e0;background:#f9f9f9">
<button onclick="ouvrirParametres()" style="width:46px;height:46px;background:#fff;border:1px solid #e0e0e0;border-radius:10px;font-size:20px">⚙️</button>
</div>

<div id="annonces" style="padding-bottom:90px"></div>

<!-- MODAL PUBLIER -->
<div id="formModal" class="modal"><div class="modal-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><h2>Publier</h2><span onclick="closeModal()" style="font-size:28px;cursor:pointer">x</span></div>
<form id="annonceForm">
<input type="text" name="titre" required placeholder="Titre ex: iPhone 13" class="profil-input">
<textarea name="description" required placeholder="Description" class="profil-input" rows="3"></textarea>
<div style="display:flex;gap:10px"><input type="number" name="prix" required placeholder="Prix" class="profil-input"><select name="devise" class="profil-input"><option value="$">$</option><option value="FC">FC</option></select></div>
<div style="display:flex;gap:10px"><input type="text" name="ville" required placeholder="Ville" class="profil-input"><select name="categorie" required class="profil-input"><option>Telephone</option><option>Automobile</option><option>Mode</option><option>Immobilier</option><option>Electronique</option><option>Autre</option></select></div>
<input type="tel" name="telephone" required placeholder="Telephone" class="profil-input">
<input type="tel" name="whatsapp" placeholder="WhatsApp 243..." class="profil-input">
<input type="url" name="photo" placeholder="Lien photo https://" class="profil-input">
<button type="submit" style="background:#FF8C00;color:white;border:none;padding:16px;width:100%;border-radius:12px;font-weight:bold;margin-top:10px">Publier maintenant</button>
<p id="formMsg" style="text-align:center"></p>
</form></div></div>

<!-- MON PROFIL - NOUVEAU DESIGN AVEC NEWS -->
<div id="modalProfil" class="modal" style="background:#fff">
<div style="width:100%;max-width:480px;margin:0 auto;min-height:100vh;background:#fff">
<div style="background:#FF8C00;padding:12px;display:flex;align-items:center;gap:12px;position:sticky;top:0">
<span onclick="fermerProfil()" style="color:#fff;font-size:24px;cursor:pointer">←</span><b style="color:#fff;font-size:17px">Mon Profil</b>
</div>
<div style="display:flex;flex-direction:column;align-items:center;padding:24px 20px">
<div style="position:relative">
<img id="previewProfil" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" onclick="ouvrirMenuPhoto()">
<div onclick="ouvrirMenuPhoto()" style="position:absolute;bottom:0;right:0;background:#FF8C00;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;font-size:14px">📷</div>
</div>
<input type="file" id="inputGalerie" accept="image/*" style="display:none" onchange="changerPhotoFichier(this)">
<input type="file" id="inputCamera" accept="image/*" capture="environment" style="display:none" onchange="changerPhotoFichier(this)">
<h3 id="affNom" style="margin:14px 0 2px 0"></h3>
<p id="affEntreprise" style="margin:0;color:#888;font-size:13px"></p>
<p id="affTel" style="margin:4px 0;color:#888;font-size:13px"></p>
</div>
<div style="padding:0 16px">
<input id="profilNom" placeholder="Nom complet" class="profil-input">
<input id="profilEntreprise" placeholder="Nom boutique / Entreprise" class="profil-input">
<input id="profilTel" placeholder="Téléphone" class="profil-input">
<input id="profilEmail" placeholder="Email" class="profil-input">
<input id="profilAdresse" placeholder="Adresse Kinshasa" class="profil-input">
<div style="background:#FFF8E1;border:1px dashed #FFC107;border-radius:12px;padding:12px;margin-top:8px">
<b style="font-size:13px">Qui sommes-nous?</b>
<textarea id="profilQui" placeholder="Décris ton activité..." style="width:100%;border:none;background:transparent;margin-top:6px;outline:none;resize:none;height:60px"></textarea>
</div>
</div>
<div style="padding:16px">
<button onclick="ouvrirNewsVendeur()" style="width:100%;background:#111;color:#fff;padding:16px;border-radius:12px;border:none;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px">📰 Voir mes News Vylo</button>
<p style="text-align:center;color:#999;font-size:11px;margin-top:10px">Sauvegarde automatique ✏️</p>
</div>
<div id="zoneNews" style="padding:16px;border-top:1px solid #eee;display:none">
<h4 style="margin:0 0 12px 0">📰 News de ma boutique</h4>
<div id="listeNews"></div>
<div style="margin-top:12px;display:flex;gap:8px">
<input id="inputNews" placeholder="Nouvel article, boutique, challenge..." style="flex:1;padding:12px;border-radius:10px;border:1px solid #ddd">
<button onclick="publierNews()" style="background:#FF8C00;color:#fff;border:none;padding:0 16px;border-radius:10px;font-weight:bold">Publier</button>
</div>
</div>
</div>
  </div>
