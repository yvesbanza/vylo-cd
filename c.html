<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-CD TEST</title>
<style>
body{font-family:Arial; margin:0; background:#f5f5f5}
header{background:orange; color:white; padding:15px; display:flex; gap:10px; align-items:center}
header img{height:40px; background:white; padding:5px; border-radius:8px}
.btn-publier{background:orange; color:white; border:none; padding:12px 20px; border-radius:8px; font-weight:bold; margin:15px; cursor:pointer}
.annonce-card{background:white; margin:10px; padding:10px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.annonce-card img{width:100%; height:200px; object-fit:cover; border-radius:5px}
.prix{color:orange; font-weight:bold; font-size:18px}
.btn-call, .btn-whatsapp{display:inline-block; padding:8px 12px; margin:5px; border-radius:5px; text-decoration:none; color:white}
.btn-call{background:green} .btn-whatsapp{background:#25D366}
#searchInput{width:calc(100% - 30px); margin:0 15px 15px 15px; padding:10px; border:1px solid #ddd; border-radius:8px}
</style>
</head>
<body>
<header>
<img src="https://via.placeholder.com/40/FFA500/FFFFFF?text=V" alt="VYLO">
<h1>VYLO-CD TEST</h1>
</header>

<button class="btn-publier" onclick="alert('On connectera le formulaire à l\'étape 2')">+ Publier</button>
<input type="text" id="searchInput" placeholder="🔍 Rechercher: iPhone, Kinshasa...">
<div id="annonces"><p style="text-align:center">Chargement...</p></div>

<script>
const SHEET_ID = '1h0kKoCdJ59-yvYurhA0A3gGkRT8T4Z76LeRXTyqrNqs';
let toutesLesAnnonces = [];

async function fetchAnnonces() {
  const url = `https://opensheet.elk.sh/${SHEET_ID}/ANNONCES`;
  const container = document.getElementById('annonces');
  try {
    const res = await fetch(url);
    const data = await res.json();
    toutesLesAnnonces = data.filter(item => item.titre).reverse();
    afficherAnnonces(toutesLesAnnonces);
  } catch(e) {
    container.innerHTML = `<p style="color:red; text-align:center">ERREUR: ${e.message}</p>`;
  }
}

function afficherAnnonces(annonces) {
  const container = document.getElementById('annonces');
  if(annonces.length === 0) {
    container.innerHTML = '<p style="text-align:center">Aucune annonce</p>';
    return;
  }
  container.innerHTML = '';
  annonces.forEach(item => {
    container.innerHTML += `
      <div class="annonce-card">
        ${item.photo? `<img src="${item.photo}">` : ''}
        <h3>${item.titre}</h3>
        <p class="prix">${item.prix} ${item.devise || 'FC'}</p>
        <p>${item.description}</p>
        <p><b>Ville:</b> ${item.ville} | <b>Cat:</b> ${item.categorie}</p>
        <a href="tel:${item.telephone}" class="btn-call">Appeler</a>
        ${item.whatsapp? `<a href="https://wa.me/${item.whatsapp}" target="_blank" class="btn-whatsapp">WhatsApp</a>` : ''}
      </div>`;
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const terme = e.target.value.toLowerCase();
  const filtrees = toutesLesAnnonces.filter(a => 
    a.titre.toLowerCase().includes(terme) || 
    a.description.toLowerCase().includes(terme) ||
    a.ville.toLowerCase().includes(terme)
  );
  afficherAnnonces(filtrees);
});

fetchAnnonces();
</script>
</body>
  </html>
