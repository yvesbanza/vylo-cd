<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-CD - Achetez et Vendez en RDC</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; }
    
    header { 
        background: linear-gradient(180deg, #FF8C00 0%, #FFA500 100%); 
        color: white; 
        padding: 15px; 
        display: flex; 
        align-items: center; 
        gap: 15px;
    }
    header img { 
        height: 60px; 
        background: white; 
        padding: 5px; 
        border-radius: 10px; 
    }
    header h1 { font-size: 32px; font-weight: bold; }
    
    .btn-publier { 
        background: #FFA500; 
        color: white; 
        border: none; 
        padding: 15px; 
        border-radius: 10px; 
        font-weight: bold; 
        margin: 15px; 
        width: calc(100% - 30px);
        font-size: 16px;
        cursor: pointer;
    }
    
    .recherche { 
        margin: 0 15px 15px 15px; 
        padding: 12px; 
        width: calc(100% - 30px); 
        border-radius: 10px; 
        border: 1px solid #ddd;
        font-size: 15px;
    }
    
    .annonce { 
        background: white; 
        margin: 15px; 
        padding: 15px; 
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .annonce img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
    .annonce h3 { font-size: 18px; margin-bottom: 8px; }
    .prix { color: #FF8C00; font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .ville-cat { font-weight: bold; margin: 8px 0; }
    .date { color: #666; font-size: 13px; margin-bottom: 10px; }
    
    .btns { display: flex; gap: 10px; }
    .btn-appeler { 
        flex: 1; 
        background: #006400; 
        color: white; 
        padding: 12px; 
        border-radius: 8px; 
        text-decoration: none; 
        text-align: center;
        font-weight: bold;
    }
    .btn-whatsapp { 
        flex: 1; 
        background: #25D366; 
        color: white; 
        padding: 12px; 
        border-radius: 8px; 
        text-decoration: none; 
        text-align: center;
        font-weight: bold;
    }
    
    .erreur { color: red; text-align: center; margin: 10px; }
</style>
</head>
<body>
    <header>
        <img src="https://i.postimg.cc/wxL0QgQz/logo-vylo.jpg" alt="Logo VYLO-CD">
        <h1>VYLO-CD</h1>
    </header>

    <button class="btn-publier">+ Publier une annonce</button>
    <input type="text" class="recherche" placeholder="🔍 Rechercher: iPhone, Voiture, Kinshasa...">

    <div id="annonces"></div>
    <p id="erreur" class="erreur"></p>

<script>
const API_URL = 'https://sheetdb.io/api/v1/ton-lien-ici'; // METS TON LIEN ICI

async function charger() {
    try {
        let res = await fetch(API_URL);
        let data = await res.json();
        afficher(data);
    } catch(e) {
        document.getElementById('erreur').innerText = 'ERREUR: Failed to fetch';
    }
}

function afficher(data) {
    let html = '';
    data.forEach(item => {
        html += `<div class="annonce">
            <img src="${item.Image || 'https://via.placeholder.com/400x250'}" alt="${item.Titre}">
            <h3>${item.Titre}</h3>
            <p class="prix">${item.Prix} $</p>
            <p>${item.Description}</p>
            <p class="ville-cat">Ville: ${item.Ville} | Cat: ${item.Categorie || 'Téléphone'}</p>
            <p class="date">${item.Date || 'Aujourd\'hui'}</p>
            <div class="btns">
                <a href="tel:+243${item.Whatsapp}" class="btn-appeler">📞 Appeler</a>
                <a href="https://wa.me/243${item.Whatsapp}" class="btn-whatsapp">💬 WhatsApp</a>
            </div>
        </div>`;
    });
    document.getElementById('annonces').innerHTML = html;
}

charger();
</script>
</body>
</html>
