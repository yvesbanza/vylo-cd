<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYLO-CD TEST</title>
<style>
body{font-family:Arial; margin:0; background:#f5f5f5}
header{background:orange; color:white; padding:15px; display:flex; gap:10px; align-items:center}
header img{height:40px; background:white; padding:5px; border-radius:8px}
.btn-publier{background:orange; color:white; border:none; padding:12px 20px; border-radius:8px; font-weight:bold; margin:15px; cursor:pointer}
.annonce-card{background:white; margin:10px; padding:10px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.annonce-card img{width:100%; height:200px; object-fit:cover; border-radius:5px}
.prix{color:orange; font-weight:bold; font-size:18px}
.btn-call,.btn-whatsapp{display:inline-block; padding:8px 12px; margin:5px; border-radius:5px; text-decoration:none; color:white}
.btn-call{background:green}.btn-whatsapp{background:#25D366}
#searchInput{width:calc(100% - 30px); margin:0 15px 15px 15px; padding:10px; border:1px solid #ddd; border-radius:8px}
/* POPUP */
.modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; overflow-y:auto}
.modal-content{background:white; margin:5% auto; padding:20px; width:90%; max-width:400px; border-radius:10px}
.modal-content input,.modal-content textarea,.modal-content select{width:calc(100% - 22px); padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px}
.modal-content button{background:orange; color:white; border:none; padding:12px; width:100%; border-radius:5px; cursor:pointer; font-size:16px}
.close{float:right; font-size:28px; cursor:pointer}
.loader{display:none; text-align:center; padding:10px}
</style>
</head>
<body>
<header>
<img src="https://i.postimg.cc/d3mG4Th1/logo.jpg" alt="VYLO">
<h1>VYLO-CD TEST</h1>
</header>

<button class="btn-publier" onclick="openModal()">+ Publier</button>
<input type="text" id="searchInput" placeholder="🔍 Rechercher: iPhone, Kinshasa...">
<div id="annonces"><p style="text-align:center">Chargement...</p></div>

<!-- POPUP FORMULAIRE -->
<div id="formModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Publier une annonce</h3>
    <form id="annonceForm">
      <input name="titre" placeholder="Titre ex: iPhone 13" required>
      <textarea name="description" placeholder="Description" required></textarea>
      <input name="prix" type="number" placeholder="Prix" required>
      <select name="devise"><option value="FC">FC</option><option value="$">$</option></select>
      <input name="ville" placeholder="Ville" required>
      <input name="categorie" placeholder="Catégorie: Téléphone, Auto..." required>
      <input name="telephone" placeholder="Téléphone: 0812345678" required>
      <input name="whatsapp" placeholder="WhatsApp: 24381..." required>
      <input name="photo" type="url" placeholder="Lien Image https://postimg.cc/..." required>
      <button type="submit">Publier l'annonce</button>
      <div class="loader" id="loader">Publication en cours...</div>
    </form>
  </div>
</div>

<script>
const SHEET_ID = '1h0kKoCdJ59-yvYurhA0A3gGkRT8T4Z76LeRXTyqrNqs';
const SHEETDB_URL = 'https://sheetdb.io/api/v1/ulpea3mizv'; // TON API
let toutesLesAnnonces = [];

function openModal(){document.getElementById('formModal').style.display='block'}
function closeModal(){document.getElementById('formModal').style.display='none'}
async function fetchAnnonces() {
  const url = SHEETDB_URL;
  const container = document.getElementById('annonces');
  try {
    const res = await fetch(url);
    const json = await res.json();
    
    const data = json.data || json; // <--- CORRECTION ICI
    
    toutesLesAnnonces = data.filter(item => item.titre).reverse();
    afficherAnnonces(toutesLesAnnonces);
  } catch(e) {
    container.innerHTML = `<p style="color:red; text-align:center">ERREUR: ${e.message}</p>`;
  }
}

function afficherAnnonces(annonces) {
  const container = document.getElementById('annonces');
  if(annonces.length === 0) {
    container.innerHTML = '<p style="text-align:center">Aucune annonce</p>';
    return;
  }
  container.innerHTML = '';
  annonces.forEach(item => {
    container.innerHTML += `
      <div class="annonce-card">
        ${item.photo? `<img src="${item.photo}">` : ''}
        <h3>${item.titre}</h3>
        <p class="prix">${item.prix} ${item.devise || 'FC'}</p>
        <p>${item.description}</p>
        <p><b>Ville:</b> ${item.ville} | <b>Cat:</b> ${item.categorie}</p>
        <a href="tel:${item.telephone}" class="btn-call">Appeler</a>
        ${item.whatsapp? `<a href="https://wa.me/${item.whatsapp}" target="_blank" class="btn-whatsapp">WhatsApp</a>` : ''}
      </div>`;
  });
}

// ENVOYER LE FORMULAIRE VERS SHEETDB
document.getElementById('annonceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);
  data.date = new Date().toLocaleString("fr-CD"); // ajoute la date

  document.getElementById('loader').style.display = 'block';
  const btn = e.target.querySelector('button');
  btn.disabled = true;

  try {
    await fetch(SHEETDB_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({data: [data]})
    });
    alert('Annonce publiée avec succès!');
    closeModal();
    e.target.reset();
    fetchAnnonces(); // recharge les annonces
  } catch(error) {
    alert('Erreur: ' + error.message);
  }
  document.getElementById('loader').style.display = 'none';
  btn.disabled = false;
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  const terme = e.target.value.toLowerCase();
  const filtrees = toutesLesAnnonces.filter(a => 
    a.titre.toLowerCase().includes(terme) || 
    a.description.toLowerCase().includes(terme) ||
    a.ville.toLowerCase().includes(terme)
  );
  afficherAnnonces(filtrees);
});

fetchAnnonces();
</script>
</body>
</html>
